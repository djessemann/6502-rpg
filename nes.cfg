# NROM (mapper 0) linker config: 32KB PRG-ROM, 8KB CHR-ROM.
# RAM map mirrors the CLAUDE.md structural contract:
#   $0000-$00FF zeropage, $0100-$01FF stack, $0200-$02FF shadow OAM,
#   $0300-$03FF VRAM buffer, $0400-$07FF general game RAM.

MEMORY {
    ZP:      start=$0000, size=$0100, type=rw, define=yes;
    OAM:     start=$0200, size=$0100, type=rw, define=yes;
    VRAMBUF: start=$0300, size=$0100, type=rw, define=yes;
    RAM:     start=$0400, size=$0400, type=rw, define=yes;

    HDR:     start=$0000, size=$0010, type=ro, file=%O, fill=yes;
    PRG:     start=$8000, size=$8000, type=ro, file=%O, fill=yes, fillval=$FF;
    CHR:     start=$0000, size=$2000, type=ro, file=%O, fill=yes, fillval=$00;
}

SEGMENTS {
    HEADER:   load=HDR, type=ro;
    CODE:     load=PRG, type=ro,  start=$8000;
    RODATA:   load=PRG, type=ro;
    VECTORS:  load=PRG, type=ro,  start=$FFFA;
    CHARS:    load=CHR, type=ro;

    ZEROPAGE: load=ZP,      type=zp;
    OAMBUF:   load=OAM,     type=bss, align=$100;
    BSS:      load=RAM,     type=bss;
}
